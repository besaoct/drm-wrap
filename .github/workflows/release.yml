name: Build & Publish Desktop Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Core Engine & Packages
        run: npm run build

      - name: Setup macOS Keychain for Code Signing
        if: matrix.platform == 'mac'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          if [ -z "$CSC_LINK" ]; then
            echo "CSC_LINK secret is not provided; skipping keychain setup."
            exit 0
          fi
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          security create-keychain -p "buildpass" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security unlock-keychain -p "buildpass" "$KEYCHAIN_PATH"
          echo "$CSC_LINK" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN_PATH" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "buildpass" "$KEYCHAIN_PATH"
          rm -f "$RUNNER_TEMP/certificate.p12"

      - name: Package macOS Applications with Developer Certificate (.dmg & .zip)
        if: matrix.platform == 'mac'
        run: |
          cp -r packages/desktop-app/build . 2>/dev/null || true
          if [ -f "$RUNNER_TEMP/build.keychain" ]; then
            export CSC_KEYCHAIN="$RUNNER_TEMP/build.keychain"
          fi
          
          # Only export Apple ID for notarization if app-specific password is provided
          if [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ]; then
            export APPLE_ID="${{ secrets.APPLE_ID }}"
            export APPLE_APP_SPECIFIC_PASSWORD="$APPLE_APP_SPECIFIC_PASSWORD"
            echo "Apple notarization credentials provided; notarization enabled."
          else
            unset APPLE_ID
            unset APPLE_APP_SPECIFIC_PASSWORD
            echo "Notice: APPLE_APP_SPECIFIC_PASSWORD is not set in secrets; skipping Apple Notarization."
          fi
          
          EXTRA_MAC_OPTS="-c.mac.hardenedRuntime=true -c.mac.entitlements=build/entitlements.mac.plist -c.mac.entitlementsInherit=build/entitlements.mac.inherit.plist"
          if [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ]; then
            EXTRA_MAC_OPTS="$EXTRA_MAC_OPTS -c.mac.notarize.teamId=${{ secrets.APPLE_TEAM_ID || '63LNPXAB49' }}"
          fi
          
          npm run package --workspace=drm-wrap-desktop-app -- --publish never $EXTRA_MAC_OPTS
          npm run package --workspace=drm-wrap-studio -- --publish never $EXTRA_MAC_OPTS
        env:
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID || '63LNPXAB49' }}

      - name: Package Windows Applications (.exe NSIS & Portable)
        if: matrix.platform == 'win'
        run: |
          npm run package --workspace=drm-wrap-desktop-app -- --win --publish never
          npm run package --workspace=drm-wrap-studio -- --win --publish never

      - name: Collect Release Artifacts
        run: |
          mkdir -p dist-release
          cp packages/desktop-app/release/*.dmg dist-release/ 2>/dev/null || true
          cp packages/desktop-app/release/*.exe dist-release/ 2>/dev/null || true
          cp packages/desktop-app/release/*.zip dist-release/ 2>/dev/null || true
          cp packages/desktop-app/release/*.blockmap dist-release/ 2>/dev/null || true
          cp packages/studio/release/*.dmg dist-release/ 2>/dev/null || true
          cp packages/studio/release/*.exe dist-release/ 2>/dev/null || true
          cp packages/studio/release/*.zip dist-release/ 2>/dev/null || true
          cp packages/studio/release/*.blockmap dist-release/ 2>/dev/null || true
        shell: bash

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: |
            dist-release/*.dmg
            dist-release/*.exe
            dist-release/*.zip
            dist-release/*.blockmap

  release:
    name: Publish GitHub Release & Packages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Core Engine & Packages
        run: npm run build

      - name: Download All Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-dist
          merge-multiple: true

      - name: Pack npm package tarball
        run: |
          npm pack --workspace=@besaoct/drm-wrap --pack-destination release-dist

      - name: Publish npm package to GitHub Packages
        run: |
          npm config set //npm.pkg.github.com/:_authToken "${{ secrets.GITHUB_TOKEN }}"
          npm publish --workspace=@besaoct/drm-wrap || echo "Package @besaoct/drm-wrap already published or version exists."
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Release Tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "RELEASE_TAG=${{ github.event.inputs.version }}" >> $GITHUB_ENV
          else
            echo "RELEASE_TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          fi

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "Release ${{ env.RELEASE_TAG }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-dist/*.dmg
            release-dist/*.exe
            release-dist/*.zip
            release-dist/*.blockmap
            release-dist/*.tgz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
